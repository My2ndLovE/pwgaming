          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerAction'
            examples:
              fold:
                summary: Fold action
                value:
                  action: fold
              call:
                summary: Call action
                value:
                  action: call
              raise:
                summary: Raise action
                value:
                  action: raise
                  amount: 20.00
              allIn:
                summary: All-in action
                value:
                  action: all_in
      responses:
