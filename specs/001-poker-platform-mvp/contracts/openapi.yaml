                type: https://api.pokerplatform.example.com/errors/invalid-action
                title: Invalid Action
                status: 400
                detail: Raise amount does not meet minimum raise requirement
                instance: /v1/games/bb0e8400-e29b-41d4-a716-446655440015/actions
                minRaise: 20.00
